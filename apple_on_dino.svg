<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    
    <!-- Dinosaur Skin Gradient -->
    <linearGradient id="dinoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <linearGradient id="dinoBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Apple Gradient -->
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- Apple Highlight -->
    <radialGradient id="appleHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Ground -->
  <ellipse cx="400" cy="720" rx="320" ry="60" fill="#022c22" opacity="0.8"/>
  <ellipse cx="400" cy="725" rx="280" ry="40" fill="#064e3b" opacity="0.9"/>

  <g filter="url(#shadow)">
    <!-- Dinosaur Body / Torso -->
    <path d="M 280,550 C 260,450 310,380 400,380 C 490,380 540,450 520,550 C 500,650 300,650 280,550 Z" fill="url(#dinoSkin)"/>

    <!-- Dinosaur Belly -->
    <path d="M 340,480 C 330,420 370,400 400,400 C 430,400 470,420 460,480 C 450,560 350,560 340,480 Z" fill="url(#dinoBelly)" opacity="0.9"/>

    <!-- Dinosaur Neck -->
    <path d="M 350,400 C 340,320 360,260 410,230 C 430,220 450,230 460,250 C 470,270 470,320 450,400 Z" fill="url(#dinoSkin)"/>

    <!-- Dinosaur Head -->
    <path d="M 360,240 C 360,170 420,150 490,170 C 540,185 570,220 560,265 C 550,310 490,330 430,310 C 380,295 360,270 360,240 Z" fill="url(#dinoSkin)"/>

    <!-- Dinosaur Snout / Cheek Highlight -->
    <ellipse cx="515" cy="245" rx="35" ry="25" fill="#86efac" opacity="0.3"/>

    <!-- Dinosaur Nostril -->
    <circle cx="535" cy="235" r="5" fill="#14532d"/>

    <!-- Dinosaur Eye -->
    <g>
      <circle cx="475" cy="220" r="18" fill="#ffffff"/>
      <circle cx="480" cy="220" r="10" fill="#0f172a"/>
      <circle cx="483" cy="217" r="4" fill="#ffffff"/> <!-- Eye highlight -->
      <!-- Eyelash / Brow -->
      <path d="M 458,205 Q 475,195 495,208" stroke="#15803d" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Dinosaur Smile -->
    <path d="M 495,255 Q 520,275 530,265" stroke="#14532d" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Back Spikes -->
    <polygon points="320,380 300,350 335,360" fill="#facc15"/>
    <polygon points="340,340 320,300 355,320" fill="#facc15"/>
    <polygon points="370,300 350,260 385,280" fill="#facc15"/>
    <polygon points="410,270 395,230 425,250" fill="#facc15"/>

    <!-- Little Arm -->
    <path d="M 380,470 Q 340,490 350,520 Q 360,530 380,500 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>

    <!-- Cute Feet -->
    <ellipse cx="340" cy="640" rx="35" ry="20" fill="#15803d"/>
    <ellipse cx="460" cy="640" rx="35" ry="20" fill="#15803d"/>
  </g>

  <!-- ===== THE RED APPLE ON TOP OF THE DINOSAUR'S HEAD ===== -->
  <g transform="translate(0, -10)" filter="url(#shadow)">
    <!-- Apple Stem -->
    <path d="M 445,145 Q 460,115 470,105" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Apple Leaf -->
    <path d="M 457,125 Q 480,110 490,125 Q 495,140 470,135 Z" fill="#22c55e"/>

    <!-- Apple Body -->
    <circle cx="440" cy="175" r="55" fill="url(#appleGrad)"/>
    
    <!-- Apple Highlight -->
    <circle cx="425" cy="155" r="25" fill="url(#appleHighlight)"/>
    <ellipse cx="455" cy="150" rx="8" ry="4" fill="#ffffff" opacity="0.5" transform="rotate(-20 455 150)"/>
  </g>

  <!-- Sparkles / Magic touch -->
  <g fill="#fde047">
    <path d="M 380,100 L 383,110 L 393,113 L 383,116 L 380,126 L 377,116 L 367,113 L 377,110 Z"/>
    <path d="M 510,130 L 512,136 L 518,138 L 512,140 L 510,146 L 508,140 L 502,138 L 508,136 Z" transform="scale(0.8) translate(120, 20)"/>
  </g>

  <!-- Title / Caption -->
  <text x="400" y="765" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">RED APPLE ON A GREEN DINOSAUR</text>
</svg>
